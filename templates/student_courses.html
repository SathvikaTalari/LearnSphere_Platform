{% extends "base.html" %}
{% block title %}Courses — LearnSphere{% endblock %}
{% block content %}
<div class="page-wrap">
    <div class="page-header">
        <div><h1 class="page-title">Browse Courses</h1><p class="page-sub">All available ML courses from our educators</p></div>
        <div class="filter-row">
            <input id="searchInput" class="filter-select" placeholder="🔍 Search courses…" oninput="filterCourses()" style="min-width:180px">
            <select id="filterDiff" onchange="filterCourses()" class="filter-select">
                <option value="">All Levels</option>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>
        </div>
    </div>

    <!-- Stats bar -->
    <div style="display:flex;gap:1rem;margin-bottom:1.4rem;flex-wrap:wrap">
        <div id="statTotal" style="font-size:.82rem;color:var(--text2);padding:.45rem .85rem;background:var(--bg3);border:1px solid var(--border);border-radius:20px">— courses available</div>
        <div id="statEnrolled" style="font-size:.82rem;color:var(--success);padding:.45rem .85rem;background:var(--bg3);border:1px solid rgba(16,185,129,.25);border-radius:20px">— enrolled</div>
    </div>

    <div class="course-grid large" id="courseGrid"><div class="loading-card"><div class="spinner"></div><p>Loading courses...</p></div></div>
</div>

<style>
/* Coursera-level course cards */
.course-card-v2 {
    display:flex; flex-direction:column; background:var(--bg3); border:1px solid var(--border);
    border-radius:var(--r2); overflow:hidden; text-decoration:none;
    transition:border-color .18s,transform .18s,box-shadow .18s;
}
.course-card-v2:hover { border-color:var(--border2); transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.2); }

/* Thumbnail */
.cc-thumb {
    height:160px; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
}
.cc-icon { font-size:3.5rem; position:relative; z-index:1; }
.cc-enrolled-badge {
    position:absolute; top:.65rem; right:.65rem; background:var(--success);
    color:#fff; font-size:.66rem; font-weight:700; padding:.18rem .5rem;
    border-radius:20px; z-index:2;
}
.cc-free-badge {
    position:absolute; top:.65rem; left:.65rem; background:rgba(16,185,129,.9);
    color:#fff; font-size:.66rem; font-weight:700; padding:.18rem .5rem;
    border-radius:20px; z-index:2;
}
.cc-price-badge {
    position:absolute; top:.65rem; left:.65rem; background:rgba(245,158,11,.9);
    color:#fff; font-size:.66rem; font-weight:700; padding:.18rem .5rem;
    border-radius:20px; z-index:2;
}

/* Card body */
.cc-body { padding:1rem 1.1rem; flex:1; display:flex; flex-direction:column; gap:.35rem; }
.cc-category { font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); }
.cc-title { font-family:var(--ff-serif); font-size:1rem; font-weight:700; color:var(--text); line-height:1.3; }
.cc-instructor { font-size:.75rem; color:var(--text2); }
.cc-desc { font-size:.78rem; color:var(--text2); line-height:1.5; flex:1; }

/* Rating row */
.cc-rating { display:flex; align-items:center; gap:.35rem; font-size:.76rem; }
.cc-stars { color:#f59e0b; letter-spacing:.05em; }
.cc-rating-val { font-weight:700; color:var(--text); }
.cc-rating-count { color:var(--text2); }

/* Meta row */
.cc-meta { display:flex; gap:.65rem; flex-wrap:wrap; font-size:.72rem; color:var(--text2); }
.cc-meta span { display:flex; align-items:center; gap:.22rem; }

/* Features */
.cc-features { display:flex; flex-wrap:wrap; gap:.3rem; }
.cc-feat { font-size:.66rem; padding:.1rem .42rem; border-radius:4px; background:var(--bg2); border:1px solid var(--border); color:var(--text2); }

/* Difficulty pill */
.cc-diff { font-size:.64rem; font-weight:700; padding:.1rem .42rem; border-radius:4px; }
.cc-diff.beginner { background:rgba(16,185,129,.1); color:var(--success); }
.cc-diff.intermediate { background:rgba(245,158,11,.1); color:var(--warn); }
.cc-diff.advanced { background:rgba(239,68,68,.08); color:var(--danger); }

/* Progress bar */
.cc-progress-wrap { margin-top:.35rem; }
.cc-progress-lbl { font-size:.65rem; color:var(--text2); margin-bottom:.25rem; }
.cc-progress-bar { height:5px; border-radius:3px; background:var(--bg2); overflow:hidden; }
.cc-progress-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,var(--accent),var(--success)); transition:width .6s ease; }

/* CTA */
.cc-cta { display:block; text-align:center; padding:.6rem 1rem; background:var(--accent); color:#fff;
           font-size:.82rem; font-weight:700; text-decoration:none; transition:filter .15s; }
.cc-cta:hover { filter:brightness(1.1); }
.cc-cta.enrolled { background:var(--success); }
</style>

<script>
var allCourses = [];
var enrolledSet = {};

async function load() {
    allCourses = await fetch('/api/courses').then(function(r){ return r.json(); });
    var enrolled = allCourses.filter(function(c){ return c.enrolled; }).length;
    document.getElementById('statTotal').textContent   = allCourses.length + ' courses available';
    document.getElementById('statEnrolled').textContent = enrolled + ' enrolled';
    render(allCourses);
}

function filterCourses() {
    var diff = document.getElementById('filterDiff').value;
    var q    = document.getElementById('searchInput').value.toLowerCase();
    var filtered = allCourses.filter(function(c){
        var matchDiff = !diff || c.difficulty === diff;
        var matchQ    = !q || (c.title||'').toLowerCase().includes(q) || (c.description||'').toLowerCase().includes(q) || (c.educator_name||'').toLowerCase().includes(q);
        return matchDiff && matchQ;
    });
    render(filtered);
}

function starsHtml(rating) {
    var r = parseFloat(rating) || 0;
    var full = Math.floor(r); var half = r - full >= 0.5 ? 1 : 0; var empty = 5 - full - half;
    return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
}

function getIcon(cat) {
    var icons = {'Deep Learning':'🤖','NLP':'💬','Natural Language Processing':'💬','Computer Vision':'👁️','Reinforcement Learning':'🎮','Data Science':'📊','Machine Learning':'🧠'};
    return icons[cat] || '📚';
}

function render(courses) {
    var grid = document.getElementById('courseGrid');
    if (!courses.length) { grid.innerHTML = '<div class="empty-courses"><p>No courses match your search.</p></div>'; return; }
    grid.innerHTML = courses.map(function(c) {
        var features = [];
        try { features = JSON.parse(c.features || '[]'); } catch(e) {}
        var duration = c.duration_hours ? c.duration_hours + 'h content' : (c.lecture_count||0) + ' lectures';
        var price = (c.price && c.price > 0) ? '₹' + c.price : 'FREE';
        var isFree = !c.price || c.price == 0;
        var enrolled = c.enrolled;
        var rating = (c.avg_rating || 0);
        var ratingCount = c.rating_count || 0;
        var progress = c.progress || 0;

        return '<div class="course-card-v2">'
          + '<div class="cc-thumb" style="background:linear-gradient(135deg,' + (c.thumbnail_color||'#00D4FF') + '25,' + (c.thumbnail_color||'#00D4FF') + '08);border-bottom:1px solid ' + (c.thumbnail_color||'#00D4FF') + '33">'
          + '<div class="cc-icon">' + getIcon(c.category) + '</div>'
          + (enrolled ? '<span class="cc-enrolled-badge">✓ Enrolled</span>' : '')
          + (isFree ? '<span class="cc-free-badge">FREE</span>' : '<span class="cc-price-badge">' + price + '</span>')
          + '</div>'

          + '<div class="cc-body">'
          + '<div style="display:flex;align-items:center;justify-content:space-between">'
          + '<span class="cc-category">' + escH(c.category||'ML') + '</span>'
          + '<span class="cc-diff ' + (c.difficulty||'beginner') + '">' + (c.difficulty||'beginner') + '</span>'
          + '</div>'
          + '<div class="cc-title">' + escH(c.title) + '</div>'
          + '<div class="cc-instructor">👩‍🏫 ' + escH(c.educator_name||'Educator') + '</div>'
          + '<div class="cc-desc">' + escH((c.description||'').slice(0,110)) + (c.description&&c.description.length>110?'…':'') + '</div>'

          + (rating > 0 ? '<div class="cc-rating"><span class="cc-stars">' + starsHtml(rating) + '</span><span class="cc-rating-val">' + rating.toFixed(1) + '</span><span class="cc-rating-count">(' + ratingCount + ')</span></div>' : '')

          + '<div class="cc-meta">'
          + '<span>📖 ' + (c.lecture_count||0) + ' lectures</span>'
          + '<span>⏱ ' + duration + '</span>'
          + '<span>👥 ' + (c.enrollment_count||c.enrolled_count||0) + ' enrolled</span>'
          + '</div>'

          + (features.length ? '<div class="cc-features">' + features.slice(0,4).map(function(f){ return '<span class="cc-feat">✓ ' + escH(f) + '</span>'; }).join('') + '</div>' : '')

          + (enrolled && progress > 0 ?
              '<div class="cc-progress-wrap"><div class="cc-progress-lbl">Progress: ' + progress + '%</div><div class="cc-progress-bar"><div class="cc-progress-fill" style="width:' + progress + '%"></div></div></div>'
              : '')
          + '</div>'

          + '<a href="/student/course/' + c.id + '" class="cc-cta' + (enrolled?' enrolled':'') + '">'
          + (enrolled ? '▶ Continue Learning' : '🚀 Start Course')
          + '</a>'
          + '</div>';
    }).join('');
}

function escH(s){ if(s==null)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
load();
</script>
{% endblock %}
