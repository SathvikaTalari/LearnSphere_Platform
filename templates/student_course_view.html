{% extends "base.html" %}
{% block title %}Course &bull; LearnSphere{% endblock %}
{% block content %}
<style>
.cv-wrap {
  max-width: 1140px;
  margin: 0 auto;
  padding: 1.5rem 1.5rem 4rem;
}

.cv-back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text2);
  text-decoration: none;
  margin-bottom: 1.25rem;
  transition: color 0.15s ease;
}
.cv-back-link:hover {
  color: var(--accent);
}

/* ── Hero Banner ─────────────────────────────────────────────────── */
.cv-hero-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--r2, 14px);
  padding: 2rem 2.25rem;
  margin-bottom: 1.75rem;
  position: relative;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
}

.cv-pills-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.75rem;
  flex-wrap: wrap;
}

.cv-cat-pill {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  background: var(--accent-glow, rgba(5, 150, 105, 0.1));
  padding: 0.25rem 0.65rem;
  border-radius: 6px;
}

.cv-diff-pill {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 0.25rem 0.6rem;
  border-radius: 6px;
}
.cv-diff-pill.beginner {
  background: rgba(16, 185, 129, 0.12);
  color: var(--success);
}
.cv-diff-pill.intermediate {
  background: rgba(245, 158, 11, 0.12);
  color: var(--warn);
}
.cv-diff-pill.advanced {
  background: rgba(239, 68, 68, 0.12);
  color: var(--danger);
}

.cv-title {
  font-family: var(--ff-display, var(--ff-sans));
  font-size: 1.85rem;
  font-weight: 800;
  color: var(--text);
  line-height: 1.25;
  margin-bottom: 0.65rem;
}

.cv-desc {
  font-size: 0.95rem;
  color: var(--text2);
  line-height: 1.6;
  max-width: 820px;
  margin-bottom: 1.25rem;
}

.cv-meta-strip {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  flex-wrap: wrap;
  font-size: 0.82rem;
  color: var(--text2);
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.cv-meta-item {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.cv-meta-item strong {
  color: var(--text);
  font-weight: 600;
}

.cv-rate-btn-inline {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text2);
  padding: 0.2rem 0.55rem;
  font-size: 0.75rem;
  cursor: pointer;
  margin-left: 0.4rem;
  transition: all 0.15s ease;
}
.cv-rate-btn-inline:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Progress Strip ──────────────────────────────────────────────── */
.cv-prog-container {
  margin-top: 1.25rem;
  padding: 1rem 1.25rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.cv-prog-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.85rem;
}
.cv-prog-label {
  font-weight: 600;
  color: var(--text);
}
.cv-prog-val {
  font-weight: 700;
  color: var(--accent);
}

.cv-prog-bar-track {
  height: 8px;
  background: var(--bg2);
  border-radius: 4px;
  overflow: hidden;
}
.cv-prog-bar-fill {
  height: 100%;
  border-radius: 4px;
  background: var(--accent);
  transition: width 0.6s ease;
}

.cv-hero-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-top: 1.25rem;
  flex-wrap: wrap;
}

/* ── Two Column Grid ─────────────────────────────────────────────── */
.cv-main-grid {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 1.75rem;
  align-items: start;
}

/* ── Curriculum (Left) ───────────────────────────────────────────── */
.cv-curriculum-panel {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--r2, 14px);
  padding: 1.5rem;
}

.cv-section-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
  padding-bottom: 0.85rem;
  border-bottom: 1px solid var(--border);
}

.cv-section-h2 {
  font-family: var(--ff-display, var(--ff-sans));
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text);
  margin: 0;
}

.cv-section-sub {
  font-size: 0.8rem;
  color: var(--text2);
}

.cv-lessons-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.cv-lesson-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.15rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  gap: 1rem;
  transition: all 0.15s ease;
  text-decoration: none;
}
.cv-lesson-row:hover {
  border-color: var(--accent);
  transform: translateX(3px);
  background: var(--bg2);
}
.cv-lesson-row.completed {
  border-color: rgba(16, 185, 129, 0.35);
  background: rgba(16, 185, 129, 0.04);
}

.cv-lesson-left {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  min-width: 0;
}

.cv-lec-circle {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text2);
  flex-shrink: 0;
}
.cv-lesson-row.completed .cv-lec-circle {
  background: var(--success);
  border-color: var(--success);
  color: #FFFFFF;
}

.cv-lec-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.cv-lec-title-text {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 0.2rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cv-lec-meta-text {
  font-size: 0.75rem;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.cv-lesson-right {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-shrink: 0;
}

.cv-toggle-done {
  padding: 0.3rem 0.65rem;
  border-radius: 6px;
  font-size: 0.72rem;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text2);
  transition: all 0.15s ease;
}
.cv-toggle-done:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.cv-toggle-done.done {
  background: rgba(16, 185, 129, 0.15);
  border-color: var(--success);
  color: var(--success);
}

.cv-lec-btn-link {
  padding: 0.35rem 0.8rem;
  border-radius: 6px;
  font-size: 0.78rem;
  font-weight: 700;
  text-decoration: none;
  background: var(--accent);
  color: #FFFFFF;
  transition: filter 0.15s ease;
  white-space: nowrap;
}
.cv-lec-btn-link:hover {
  filter: brightness(1.1);
}
.cv-lesson-row.completed .cv-lec-btn-link {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
}

/* ── Sidebar (Right) ─────────────────────────────────────────────── */
.cv-sidebar-col {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.cv-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--r2, 14px);
  padding: 1.35rem 1.4rem;
}

.cv-card h4 {
  font-family: var(--ff-display, var(--ff-sans));
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text);
  margin-top: 0;
  margin-bottom: 0.85rem;
}

/* Certificate Card */
.cv-cert-card {
  border: 1px solid var(--border);
  transition: all 0.2s ease;
}
.cv-cert-card.completed {
  border-color: rgba(16, 185, 129, 0.4);
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, var(--bg3) 100%);
}
.cv-cert-pill-ready {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--success);
  background: rgba(16, 185, 129, 0.12);
  padding: 0.2rem 0.55rem;
  border-radius: 4px;
  margin-bottom: 0.5rem;
}
.cv-cert-desc {
  font-size: 0.82rem;
  color: var(--text2);
  line-height: 1.5;
  margin-bottom: 1rem;
}
.cv-cert-download-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 0.65rem 1rem;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 700;
  text-decoration: none;
  background: var(--accent);
  color: #FFFFFF;
  text-align: center;
  transition: filter 0.15s ease;
}
.cv-cert-download-btn:hover {
  filter: brightness(1.1);
}

.cv-bullets-list {
  margin: 0;
  padding-left: 1.15rem;
  font-size: 0.83rem;
  color: var(--text2);
  line-height: 1.6;
}
.cv-bullets-list li {
  margin-bottom: 0.45rem;
}

.cv-skill-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}
.cv-skill-chip {
  font-size: 0.72rem;
  padding: 0.25rem 0.55rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
}

/* Discussion Forum at bottom */
.cv-forum-panel {
  margin-top: 2rem;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--r2, 14px);
  padding: 1.5rem;
}
.cv-forum-input-row {
  display: flex;
  gap: 0.75rem;
  margin-top: 1rem;
}
.cv-forum-input {
  flex: 1;
  padding: 0.75rem 1rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.88rem;
  outline: none;
}
.cv-forum-input:focus {
  border-color: var(--accent);
}

@media (max-width: 860px) {
  .cv-main-grid {
    grid-template-columns: 1fr;
  }
}
</style>

<div class="cv-wrap animate-in">
  <a href="/student/courses" class="cv-back-link">&larr; Back to All Courses</a>
  <div id="courseContent">
    <div class="loading-card" style="padding:3rem;text-align:center;">
      <div class="spinner"></div>
      <p style="margin-top:0.75rem;color:var(--text2)">Loading course curriculum...</p>
    </div>
  </div>
</div>

<!-- Rating Modal -->
<div id="rateModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:2rem;max-width:380px;width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.3);">
    <h3 style="font-family:var(--ff-display,var(--ff-sans));margin-top:0;margin-bottom:0.5rem;color:var(--text)">Rate this Course</h3>
    <p style="font-size:0.85rem;color:var(--text2);margin-bottom:1rem">Share your feedback on the curriculum and depth.</p>
    <div style="display:flex;gap:0.4rem;justify-content:center;margin-bottom:1.25rem" id="starRow">
      <button class="star-btn" onclick="setStar(1)">1 &starf;</button>
      <button class="star-btn" onclick="setStar(2)">2 &starf;</button>
      <button class="star-btn" onclick="setStar(3)">3 &starf;</button>
      <button class="star-btn" onclick="setStar(4)">4 &starf;</button>
      <button class="star-btn" onclick="setStar(5)">5 &starf;</button>
    </div>
    <textarea id="rateReview" placeholder="Write an optional review..." style="width:100%;padding:0.6rem 0.8rem;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--ff-sans);font-size:0.85rem;resize:vertical;outline:none;margin-bottom:1rem;box-sizing:border-box" rows="3"></textarea>
    <div style="display:flex;gap:0.65rem;justify-content:center">
      <button onclick="submitRating()" class="btn btn-primary" id="rateSubmitBtn">Submit Rating</button>
      <button onclick="closeRateModal()" class="btn btn-ghost">Cancel</button>
    </div>
  </div>
</div>

<script>
var courseId = '{{ course_id }}';
var selectedStar = 0;

async function load() {
  try {
    const data = await fetch('/api/courses/' + courseId).then(r => r.json());
    if (data.error || !data.course) {
      document.getElementById('courseContent').innerHTML = '<div style="padding:3rem;text-align:center;color:var(--danger)">Course not found.</div>';
      return;
    }

    const c = data.course;
    const lecs = data.lectures || [];
    const done = data.completed || [];
    const isEnrolled = data.enrolled || false;
    const doneCount = lecs.filter(l => done.includes(l.id)).length;
    const pct = lecs.length ? Math.round((doneCount / lecs.length) * 100) : 0;
    const isFullyComplete = pct === 100 && lecs.length > 0;

    // Fetch ratings & certificates in parallel
    const [ratingData, certData] = await Promise.all([
      fetch('/api/courses/' + courseId + '/rating').then(r => r.json()).catch(() => ({ avg: 0, count: 0 })),
      fetch('/api/certificate/' + courseId).then(r => r.json()).catch(() => ({ success: false }))
    ]);

    const avgRating = ratingData.avg || 0;
    const ratingCount = ratingData.count || 0;
    const hasCert = certData.success || isFullyComplete;

    // Find next uncompleted lecture
    const nextLec = lecs.find(l => !done.includes(l.id)) || lecs[0];

    // Compute duration
    const totalMins = lecs.reduce((acc, l) => acc + (l.duration_mins || 15), 0);
    const totalHrs = (totalMins / 60).toFixed(1);

    // Derived learning items
    const catItems = {
      'Machine Learning': ['Understand core ML algorithms & mathematical principles', 'Build predictive regression and classification pipelines', 'Perform cross-validation and bias-variance tradeoff analysis', 'Deploy and serve trained models in production environments'],
      'Deep Learning': ['Construct multi-layer perceptrons, CNNs, and recurrent networks', 'Train models with PyTorch & TensorFlow with GPU acceleration', 'Apply modern regularization, dropout, and normalization techniques', 'Master transfer learning and fine-tuning pretrained foundations'],
      'Natural Language Processing': ['Implement text tokenization, embeddings, and attention mechanisms', 'Fine-tune modern transformer and BERT-family architectures', 'Build retrieval-augmented generation (RAG) knowledge pipelines', 'Evaluate language models using BLEU, ROUGE, and perplexity'],
      'Computer Vision': ['Build robust convolutional feature extraction pipelines', 'Train modern object detection (YOLO) and segmentation models', 'Apply transfer learning with ResNet, EfficientNet, and ViTs', 'Implement real-time visual inference pipelines'],
      'MLOps': ['Containerize machine learning services using Docker', 'Construct continuous training and CI/CD deployment pipelines', 'Track experiments and artifact versioning using MLflow', 'Implement model drift detection and automated monitoring']
    };
    const learnBullets = catItems[c.category] || [
      'Master the foundational principles and hands-on implementation',
      'Analyze real-world data and train robust machine learning models',
      'Solve practical challenges with industry-standard tooling',
      'Build end-to-end projects ready for your technical portfolio'
    ];

    const prereqMap = {
      'beginner': ['Familiarity with basic Python syntax', 'Fundamental high school algebra & statistics', 'Curiosity and passion for machine learning'],
      'intermediate': ['Solid Python programming skills (NumPy & Pandas)', 'Basic linear algebra and probability concepts', 'Introductory experience with ML modeling'],
      'advanced': ['Strong Python engineering and scientific computing experience', 'Multivariate calculus and linear algebra foundations', 'Prior experience training neural network models']
    };
    const prereqs = prereqMap[c.difficulty] || prereqMap['beginner'];

    // ── Build HTML ──
    let html = '';

    // 1. Hero Card
    html += '<div class="cv-hero-card">';
    html += '  <div class="cv-pills-row">';
    html += '    <span class="cv-cat-pill">' + escH(c.category || 'Machine Learning') + '</span>';
    html += '    <span class="cv-diff-pill ' + escH(c.difficulty || 'beginner') + '">' + escH(c.difficulty || 'Beginner') + '</span>';
    html += '  </div>';
    html += '  <h1 class="cv-title">' + escH(c.title) + '</h1>';
    html += '  <p class="cv-desc">' + escH(c.description || 'Comprehensive curriculum designed by university educators and ML engineers.') + '</p>';

    // Meta row
    html += '  <div class="cv-meta-strip">';
    html += '    <div class="cv-meta-item"><span>Instructor:</span> <strong>' + escH(c.educator_name || 'LearnSphere Faculty') + '</strong></div>';
    html += '    <div class="cv-meta-item"><span>Lessons:</span> <strong>' + lecs.length + ' Lessons</strong></div>';
    html += '    <div class="cv-meta-item"><span>Total Duration:</span> <strong>' + totalHrs + ' Hours</strong></div>';
    if (avgRating > 0) {
      html += '    <div class="cv-meta-item"><span>Rating:</span> <strong>' + avgRating.toFixed(1) + ' / 5.0</strong> (' + ratingCount + ')';
      html += '      <button class="cv-rate-btn-inline" onclick="openRateModal()">Rate Course</button>';
      html += '    </div>';
    } else {
      html += '    <div class="cv-meta-item"><span>Rating:</span> <span>No ratings yet</span>';
      html += '      <button class="cv-rate-btn-inline" onclick="openRateModal()">Rate Course</button>';
      html += '    </div>';
    }
    html += '  </div>';

    // Progress Bar (when enrolled)
    if (isEnrolled) {
      html += '  <div class="cv-prog-container">';
      html += '    <div class="cv-prog-header">';
      html += '      <span class="cv-prog-label">' + (isFullyComplete ? 'Course Completed' : 'Your Learning Progress') + '</span>';
      html += '      <span class="cv-prog-val">' + pct + '% (' + doneCount + '/' + lecs.length + ' Lessons)</span>';
      html += '    </div>';
      html += '    <div class="cv-prog-bar-track">';
      html += '      <div class="cv-prog-bar-fill" style="width: ' + pct + '%;"></div>';
      html += '    </div>';
      html += '  </div>';
    }

    // Hero Action Buttons
    html += '  <div class="cv-hero-actions">';
    if (!isEnrolled) {
      html += '    <button onclick="enrollNow()" class="btn btn-primary" id="enrollBtn" style="padding:0.7rem 1.6rem;font-size:0.92rem;font-weight:700">Enroll in Course</button>';
    } else if (isFullyComplete) {
      html += '    <a href="/certificate/' + courseId + '/download" target="_blank" class="btn btn-primary" style="padding:0.7rem 1.6rem;font-size:0.92rem;font-weight:700">Download Certificate &rarr;</a>';
      if (lecs.length > 0) {
        html += '    <a href="/student/lecture/' + lecs[0].id + '" class="btn btn-ghost" style="padding:0.7rem 1.25rem;font-size:0.92rem">Review Lessons</a>';
      }
    } else if (nextLec) {
      html += '    <a href="/student/lecture/' + nextLec.id + '" class="btn btn-primary" style="padding:0.7rem 1.6rem;font-size:0.92rem;font-weight:700">Continue Learning &rarr;</a>';
    }
    html += '  </div>';
    html += '</div>';

    // 2. Main Two-Column Grid
    html += '<div class="cv-main-grid">';

    // Left Column: Course Curriculum
    html += '  <div class="cv-curriculum-panel">';
    html += '    <div class="cv-section-title-row">';
    html += '      <h2 class="cv-section-h2">Course Curriculum</h2>';
    html += '      <span class="cv-section-sub">' + lecs.length + ' Lessons &bull; ' + doneCount + ' Completed</span>';
    html += '    </div>';

    if (lecs.length === 0) {
      html += '    <div style="padding:2.5rem;text-align:center;color:var(--text2)">No lessons have been published for this course yet.</div>';
    } else {
      html += '    <div class="cv-lessons-list">';
      lecs.forEach((l, idx) => {
        const isDone = done.includes(l.id);
        const typeLabel = (l.lecture_type || 'reading').toUpperCase();
        const durationText = (l.duration_mins || 15) + ' min';

        html += '      <div class="cv-lesson-row ' + (isDone ? 'completed' : '') + '">';
        html += '        <div class="cv-lesson-left">';
        html += '          <div class="cv-lec-circle">' + (isDone ? '&check;' : (idx + 1)) + '</div>';
        html += '          <div class="cv-lec-info">';
        html += '            <span class="cv-lec-title-text">' + escH(l.title) + '</span>';
        html += '            <span class="cv-lec-meta-text">';
        html += '              <span>' + typeLabel + '</span> &bull; <span>' + durationText + '</span>';
        if (l.code_example) {
          html += '              &bull; <span>Interactive Code</span>';
        }
        html += '            </span>';
        html += '          </div>';
        html += '        </div>';

        html += '        <div class="cv-lesson-right">';
        if (isEnrolled) {
          html += '          <button type="button" class="cv-toggle-done ' + (isDone ? 'done' : '') + '" onclick="toggleLessonDone(event, \'' + l.id + '\')" title="Click to toggle completed status">' + (isDone ? 'Completed &check;' : 'Mark Complete') + '</button>';
        }
        html += '          <a href="/student/lecture/' + l.id + '" class="cv-lec-btn-link">' + (isDone ? 'Review' : 'Start &rarr;') + '</a>';
        html += '        </div>';
        html += '      </div>';
      });
      html += '    </div>';
    }
    html += '  </div>';

    // Right Column: Highlights, Certificate & Prerequisites
    html += '  <div class="cv-sidebar-col">';

    // Certificate Card
    if (hasCert || isFullyComplete) {
      html += '    <div class="cv-card cv-cert-card completed">';
      html += '      <span class="cv-cert-pill-ready">Verified Certificate Available</span>';
      html += '      <h4>Course Certificate</h4>';
      html += '      <p class="cv-cert-desc">Congratulations! You have completed all lessons and fulfilled all requirements for this course.</p>';
      html += '      <a href="/certificate/' + courseId + '/download" target="_blank" class="cv-cert-download-btn">Download Certificate (PDF)</a>';
      html += '    </div>';
    } else {
      html += '    <div class="cv-card cv-cert-card">';
      html += '      <h4>Official Certificate</h4>';
      html += '      <p class="cv-cert-desc">Complete all ' + lecs.length + ' lessons to earn your verifiable LearnSphere Certificate of Completion.</p>';
      html += '      <div style="font-size:0.78rem;font-weight:600;color:var(--text2)">' + doneCount + ' of ' + lecs.length + ' lessons completed (' + pct + '%)</div>';
      html += '    </div>';
    }

    // What You'll Learn Card
    html += '    <div class="cv-card">';
    html += '      <h4>What You\'ll Learn</h4>';
    html += '      <ul class="cv-bullets-list">';
    learnBullets.forEach(b => {
      html += '        <li>' + escH(b) + '</li>';
    });
    html += '      </ul>';
    html += '    </div>';

    // Prerequisites Card
    html += '    <div class="cv-card">';
    html += '      <h4>Prerequisites</h4>';
    html += '      <ul class="cv-bullets-list">';
    prereqs.forEach(p => {
      html += '        <li>' + escH(p) + '</li>';
    });
    html += '      </ul>';
    html += '    </div>';

    // Instructor Card
    html += '    <div class="cv-card">';
    html += '      <h4>Course Instructor</h4>';
    html += '      <div style="display:flex;align-items:center;gap:0.75rem;">';
    html += '        <div style="width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem">';
    html +=            (c.educator_name ? c.educator_name.charAt(0).toUpperCase() : 'E');
    html += '        </div>';
    html += '        <div>';
    html += '          <div style="font-size:0.9rem;font-weight:700;color:var(--text)">' + escH(c.educator_name || 'LearnSphere Faculty') + '</div>';
    html += '          <div style="font-size:0.75rem;color:var(--text2)">Lead Instructor &bull; ML Dept.</div>';
    html += '        </div>';
    html += '      </div>';
    html += '    </div>';

    html += '  </div>'; // /cv-sidebar-col
    html += '</div>';   // /cv-main-grid

    // Discussion Forum (when enrolled)
    if (isEnrolled) {
      html += '<div class="cv-forum-panel">';
      html += '  <h3 style="font-family:var(--ff-display,var(--ff-sans));margin-top:0;margin-bottom:0.75rem;color:var(--text);font-size:1.15rem">Course Discussion Forum</h3>';
      html += '  <p style="font-size:0.85rem;color:var(--text2);margin-bottom:1rem">Collaborate with peers, ask questions about lecture content, or share helpful resources.</p>';
      html += '  <div id="forumList" style="margin-bottom:1.25rem;max-height:300px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem;">Loading discussion posts...</div>';
      html += '  <div class="cv-forum-input-row">';
      html += '    <input type="text" id="forumInput" class="cv-forum-input" placeholder="Ask a question or share a thought on this course..." onkeydown="if(event.key===\'Enter\')postForum()">';
      html += '    <button class="btn btn-primary" onclick="postForum()" style="padding:0.6rem 1.4rem">Post</button>';
      html += '  </div>';
      html += '</div>';
    }

    document.getElementById('courseContent').innerHTML = html;
    if (isEnrolled) {
      loadForums();
    }
  } catch (err) {
    console.error(err);
    document.getElementById('courseContent').innerHTML = '<div style="padding:3rem;text-align:center;color:var(--danger)">Error loading course details. Please refresh.</div>';
  }
}

async function toggleLessonDone(e, lecId) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
  try {
    await fetch('/api/toggle_lecture/' + lecId, { method: 'POST' });
    load();
  } catch (err) {
    console.error(err);
  }
}

async function enrollNow() {
  const btn = document.getElementById('enrollBtn');
  if (btn) {
    btn.textContent = 'Enrolling...';
    btn.disabled = true;
  }
  await fetch('/api/enroll/' + courseId, { method: 'POST' });
  load();
}

function openRateModal() {
  document.getElementById('rateModal').style.display = 'flex';
}
function closeRateModal() {
  document.getElementById('rateModal').style.display = 'none';
}
function setStar(n) {
  selectedStar = n;
  document.querySelectorAll('#starRow .star-btn').forEach((b, i) => {
    b.classList.toggle('on', i < n);
  });
}
async function submitRating() {
  if (!selectedStar) {
    alert('Please select a star rating');
    return;
  }
  const btn = document.getElementById('rateSubmitBtn');
  btn.textContent = 'Saving...';
  btn.disabled = true;
  await fetch('/api/courses/' + courseId + '/rate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ rating: selectedStar, review: document.getElementById('rateReview').value.trim() })
  });
  closeRateModal();
  load();
}

async function loadForums() {
  const container = document.getElementById('forumList');
  if (!container) return;
  try {
    const res = await fetch('/api/community/forums/' + courseId);
    const data = await res.json();
    if (!data || !data.length) {
      container.innerHTML = '<p style="color:var(--text2);font-size:0.85rem;margin:0">No discussion posts yet. Start the conversation!</p>';
      return;
    }
    let html = '';
    data.forEach(m => {
      html += '<div style="padding:0.65rem 0;border-bottom:1px solid var(--border)">';
      html += '  <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.25rem">';
      html += '    <strong style="color:var(--accent);font-size:0.85rem">' + escH(m.username) + '</strong>';
      html += '    <span style="font-size:0.72rem;color:var(--text2)">' + escH(m.created_at || '') + '</span>';
      html += '  </div>';
      html += '  <div style="font-size:0.85rem;color:var(--text);line-height:1.4">' + escH(m.content) + '</div>';
      html += '</div>';
    });
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<p style="color:var(--text2);font-size:0.85rem">Could not load discussions.</p>';
  }
}

async function postForum() {
  const inp = document.getElementById('forumInput');
  const text = (inp.value || '').trim();
  if (!text) return;
  inp.disabled = true;
  await fetch('/api/community/forums/' + courseId, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: text })
  });
  inp.value = '';
  inp.disabled = false;
  inp.focus();
  loadForums();
}

function escH(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

load();
</script>
{% endblock %}
