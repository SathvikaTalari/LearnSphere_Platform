<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lsEmeraldGrad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="lsRingGrad" x1="36" y1="10" x2="4" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="lsCorePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#10B981"/>
    </radialGradient>
  </defs>

  <!-- Outer Sphere Precision Ring -->
  <circle cx="20" cy="20" r="16.5" stroke="url(#lsEmeraldGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Meridian S-Helix Ribbon (Forms stylized S of Sphere and L of Learn) -->
  <path d="M 20 3.5 C 27 3.5 32 8.5 32 15 C 32 19.5 28.5 22.5 23.5 24 C 17 26 13.5 28.5 13.5 32 C 13.5 35 16 36.5 20 36.5" 
        stroke="url(#lsEmeraldGrad)" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- 3D Planetary Equatorial Orbit (23.5-degree axial tilt) -->
  <ellipse cx="20" cy="20" rx="16.5" ry="6.8" 
           stroke="url(#lsRingGrad)" stroke-width="2.2" 
           transform="rotate(-24 20 20)" 
           stroke-linecap="round" 
           stroke-dasharray="72 26"/>

  <!-- Central Knowledge Core (Node of Intellect) -->
  <circle cx="20" cy="20" r="3.6" fill="url(#lsCorePulse)"/>
  <circle cx="20" cy="20" r="1.4" fill="#FFFFFF"/>
</svg>